# ===================================================================
# MaximizeCRM Backend Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=MaximizeCRM

# MySQL Database Configuration via Environment Variables
# Default values provided for local development, easily overridden via environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:maximizecrm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Allowed Origin for Angular Frontend
cors.allowed-origins=http://localhost:4200

# JWT Configuration (Secret must be at least 256 bits / 32 bytes for HMAC-SHA256)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


